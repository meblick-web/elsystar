name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run security:check
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build
      - name: Validate security and operations scripts
        run: |
          node --check scripts/security-preflight.mjs
          bash -n scripts/backup-postgres.sh
          bash -n scripts/restore-postgres.sh
      - name: Validate Codespaces configuration
        run: |
          docker compose -f .devcontainer/docker-compose.yml config >/dev/null
          bash -n .devcontainer/bootstrap.sh
          bash -n .devcontainer/start-preview.sh
          node --check packages/database/scripts/codespaces-safe-push.mjs
          node --check packages/database/scripts/bootstrap-visible-content.mjs
          node --check packages/database/scripts/bootstrap-content-qa-alpha9-3.mjs
          node --check .devcontainer/codespaces-next-proxy.mjs
